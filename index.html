<script>
// إعداد قاعدة البيانات مع استرجاع البيانات المحفوظة
let db = JSON.parse(localStorage.getItem('my_sales_db')) || {
    items: [], customers: [], invoices: [], purchases: [], invCounter: 1, purCounter: 1
};

// دالة الحفظ التلقائي
function saveToDisk() {
    localStorage.setItem('my_sales_db', JSON.stringify(db));
}

// تعديل دالة إضافة زبون لتشمل هيكلية المعاملات
function addCustomer() {
    const name = document.getElementById('c-name').value.trim();
    const phone = document.getElementById('c-phone').value.trim();
    const addr = document.getElementById('c-addr').value.trim();
    const bal = parseFloat(document.getElementById('c-bal').value) || 0;
    if (!name) { alert('الرجاء إدخال اسم الزبون'); return; }
    
    db.customers.push({
        id: Date.now(), name, phone, addr, 
        transactions: bal ? [{ date: new Date().toISOString().split('T')[0], desc: 'رصيد افتتاحي', debit: 0, credit: bal }] : []
    });
    saveToDisk();
    closeModal('modal-customer');
    renderCustomers();
}

// دالة حفظ الدفعة (سند قبض/صرف)
function openTransactionModal(custId) {
    document.getElementById('trans-cust-id').value = custId;
    openModal('modal-trans');
}

function saveTransaction() {
    const custId = parseInt(document.getElementById('trans-cust-id').value);
    const type = document.getElementById('trans-type').value;
    const amount = parseFloat(document.getElementById('trans-amt').value) || 0;
    const desc = document.getElementById('trans-desc').value || 'عملية نقدية';
    
    const customer = db.customers.find(x => x.id === custId);
    if (!customer) return;

    customer.transactions.push({
        date: new Date().toISOString().split('T')[0],
        desc: desc,
        debit: type === 'debit' ? amount : 0,
        credit: type === 'credit' ? amount : 0
    });

    saveToDisk();
    closeModal('modal-trans');
    renderCustomers();
    alert('تم حفظ العملية بنجاح');
}

// تحديث عرض الزبائن ليشمل زر "سند"
function renderCustomers() {
    const tb = document.getElementById('cust-table');
    tb.innerHTML = db.customers.map(c => {
        const bal = getCustomerBalance(c);
        return `<tr>
            <td style="font-weight:500">${c.name}</td>
            <td style="color:var(--color-text-secondary)">${c.phone || '-'}</td>
            <td class="${bal >= 0 ? 'pos-val' : 'neg-val'}" style="font-weight:500">${bal.toFixed(2)}</td>
            <td>
                <button class="btn" onclick="viewStatement(${c.id})" style="font-size:12px"><i class="ti ti-file-description"></i></button>
                <button class="btn btn-primary" onclick="openTransactionModal(${c.id})" style="font-size:12px"><i class="ti ti-cash"></i> سند</button>
            </td>
        </tr>`;
    }).join('');
}
</script>

<div class="modal-overlay" id="modal-trans">
    <div class="modal">
        <div class="modal-header"><h3>سند قبض / صرف</h3><button class="btn" onclick="closeModal('modal-trans')"><i class="ti ti-x"></i></button></div>
        <input type="hidden" id="trans-cust-id">
        <div class="form-group"><label>نوع العملية</label>
            <select id="trans-type">
                <option value="credit">استلام دفعة من الزبون (+)</option>
                <option value="debit">صرف دفعة للزبون (-)</option>
            </select>
        </div>
        <div class="form-group"><label>المبلغ</label><input id="trans-amt" type="number" placeholder="0.00"></div>
        <div class="form-group"><label>البيان</label><input id="trans-desc" placeholder="مثال: سداد جزء من الرصيد"></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveTransaction()"><i class="ti ti-check"></i> حفظ العملية</button>
    </div>
</div>
